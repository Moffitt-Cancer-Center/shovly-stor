query GovernedGroupAuthorizationRuleMutationJob($id: ID!) {
    governedGroupAuthorizationRuleMutationJob(jobId: $id) {
        jobId
        jobProgress
        jobStatus
        results {
            extensions {
                errorCode
                errorDetails
                errorMessage
            }
            result {
                name
            }
            succeeded
        }
    }
}
