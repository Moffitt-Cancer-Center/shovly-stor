query GovernedGroupMutationJob($id: ID!) {
    governedGroupMutationJob(jobId: $id) {
        jobId
        jobStatus
        results {
            succeeded
            extensions {
                errorMessage
                errorDetails
                errorCode
            }
            result {
                group {
                    samAccountName
                    directoryServices {
                        name
                    }
                }
            }
        }
    }
}
